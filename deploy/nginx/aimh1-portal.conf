server {
    listen 80;
    server_name ai.ahau.edu.cn 210.45.177.74;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ai.ahau.edu.cn 210.45.177.74;

    # Use the certificate issued for ai.ahau.edu.cn on the target server.
    ssl_certificate /etc/nginx/ssl/ai.ahau.edu.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/ai.ahau.edu.cn.key;

    client_max_body_size 20m;

    location /api/chat/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 650s;
        proxy_send_timeout 650s;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
