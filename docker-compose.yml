services:
  aimh1-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: aimh1-ai-portal:latest
    container_name: aimh1-portal
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      SERVICE_PROXY_TARGET: "http://127.0.0.1:3101"
    network_mode: "host"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
