server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 20m;

    root /usr/share/nginx/html/dist;
    index index.html;

    location = /api/health {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO /api/health;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_pass aimh1-php:9000;
    }

    location = /api/chat/stream {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO /api/chat/stream;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_pass aimh1-php:9000;

        fastcgi_buffering off;
        gzip off;
        fastcgi_read_timeout 650s;
        fastcgi_send_timeout 650s;
        add_header X-Accel-Buffering no;
    }

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_pass aimh1-php:9000;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    location = /callback {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO /callback;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_pass aimh1-php:9000;
    }

    location = /admin {
        try_files /admin.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
