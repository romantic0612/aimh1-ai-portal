services:
  aimh1-php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: aimh1-tp51-php:latest
    container_name: aimh1-php
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      APP_DEBUG: "false"
    expose:
      - "9000"

  aimh1-nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: aimh1-tp51-nginx:latest
    container_name: aimh1-nginx
    restart: unless-stopped
    depends_on:
      - aimh1-php
    ports:
      - "7998:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health | grep -q '\"ok\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
